[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-orchestration"
version = "0.1.0"
description = "Imaginary sample-handling workcell for learning: hardware simulator, example controller and an Orca driver plug-in"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Orca and its driver layer are installed from the Cheshire Labs repositories, see docs/orca-integration.md
orca = []
# the planning agent (src/agent): the Claude API SDK and Pydantic for the workflow spec
agent = ["anthropic>=1.0", "pydantic>=2"]
# the agent's desktop window (python -m agent.ui)
ui = ["PySide6>=6.6"]

[project.scripts]
workcell-sim = "simulator.__main__:main"
workcell-controller = "controller.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
controller = ["decks/*.json"]
agent = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
